# LINE's own link-preview crawler ("Linespider") doesn't execute JS, so it
# only ever sees the SPA's static index.html for any route. This map lets the
# /order location below proxy just that crawler to the backend's server-
# rendered order-share HTML, without affecting the real LIFF in-app browser
# (whose own User-Agent contains "Line/" but never "Linespider").
map $http_user_agent $is_link_preview_bot {
    default 0;
    ~*Linespider 1;
}

server {
    listen ${PORT};
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        resolver ${DNS_RESOLVER} ipv6=on valid=1s;
        set $upstream_target ${API_TARGET_URL};
        proxy_pass $upstream_target;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /order {
        if ($is_link_preview_bot) {
            rewrite ^ /__order-share last;
        }
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location = /__order-share {
        internal;
        resolver ${DNS_RESOLVER} ipv6=on valid=1s;
        set $upstream_target ${API_TARGET_URL}/api/public/orders/share?t=$arg_t;
        proxy_pass $upstream_target;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/product/([^/]+)/share$ {
        return 301 /identification-report/$1/share;
    }

    location ~ ^/identification-report/([^/]+)/share$ {
        resolver ${DNS_RESOLVER} ipv6=on valid=1s;
        set $upstream_target ${API_TARGET_URL}/api/public/inventory/$1/share;
        proxy_pass $upstream_target;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
